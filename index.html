<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>譜面大会ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#0a0a0a);--ink:light-dark(#0a0a0a,#fff);--mute:light-dark(#707070,#8c8c8c);--line:light-dark(#e2e2e2,#262626);--card:light-dark(#f3f3f3,#151515);--acc:#ffd60a;--on:#0a0a0a;--acc-ink:light-dark(#0a0a0a,#ffd60a);--num:"Barlow Condensed",sans-serif}
*,*::before,*::after{border-radius:0!important}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(4vw,16px)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;gap:16px;height:64px}
.conn{margin-left:auto;width:10px;height:10px;border-radius:50%;background:var(--line);flex:none;transition:background .3s}
.conn.on{background:var(--acc);box-shadow:0 0 0 3px var(--ink)}
.seg{display:inline-flex;background:var(--card);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:0 16px;min-height:40px;border-radius:9px;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sub{display:flex;gap:26px;margin-top:28px;border-bottom:1px solid var(--line);overflow-x:auto}
.sub button{border:0;background:none;padding:10px 0;font-weight:900;font-size:20px;color:var(--mute);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-1px;white-space:nowrap}
.sub button[aria-pressed=true]{color:var(--ink);border-color:var(--acc)}
.sub b{font:italic 800 15px var(--num);color:var(--mute);margin-right:6px}.sub button[aria-pressed=true] b{color:var(--acc-ink)}
section{padding:24px 0 120px}
h2{font-size:13px;font-weight:700;color:var(--mute);margin:28px 0 10px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}.btn.pri:hover{border-color:var(--ink)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.done{background:var(--ink);border-color:var(--ink);color:var(--acc)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
input[type=text],input[type=password],textarea{background:var(--card);border:1.5px solid transparent;border-radius:10px;padding:9px 12px;width:100%;font-size:16px;outline:0;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--ink)}
input[readonly],textarea[readonly]{color:var(--mute)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.6;resize:vertical}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sw{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:700;white-space:nowrap}
.sw input{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{transform:translateX(18px);background:var(--on)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;padding-top:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));justify-content:flex-end;align-items:center}
.bar .sp{margin-right:auto}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* pack */
.drop{display:grid;place-items:center;gap:14px;text-align:center;border:1.5px dashed var(--line);border-radius:20px;padding:44px 16px;transition:border-color .15s,background .15s}
.drop.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.drop .ic{width:56px;height:56px;background:var(--acc);display:grid;place-items:center;color:var(--on)}
.drop .ic svg{width:26px;height:26px}
.drop b{font-size:20px;font-weight:900;white-space:nowrap}
.drop .r{display:flex;gap:8px;justify-content:center}
.drop.mini{grid-template-columns:auto 1fr auto;padding:12px 14px;text-align:left;border-style:solid}
.drop.mini .ic{width:40px;height:40px}.drop.mini .ic svg{width:18px;height:18px}
.drop.mini b{font-size:16px}
.cnt{font:italic 800 28px var(--num);margin-right:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.opts .nm{display:flex;align-items:center;gap:10px;flex:1 1 240px;font-weight:700;white-space:nowrap}
.mini-seg{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.mini-seg .seg button{min-height:36px;padding:0 12px;font-size:14px}
.mini-seg input{width:150px}
.it{display:grid;grid-template-columns:56px 44px minmax(0,1.3fr) minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it .no{font:italic 800 32px/1 var(--num);text-align:right}
.lab{display:grid;place-items:center;width:36px;height:36px;background:var(--acc);color:var(--on);font:800 20px var(--num)}
.lab.x{background:none;border:1.5px dashed var(--line)}
.it .src{grid-column:3/-1;font-size:12px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;word-break:break-all}
.it .src .bad{font-weight:900;background:var(--acc);color:var(--on);padding:0 6px}
.msg{font-size:14px;font-weight:700;margin-top:10px;display:grid;gap:4px;border-left:4px solid var(--acc);padding-left:10px}.msg:empty{display:none}
/* publish */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:0 14px;min-height:38px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip .d{width:8px;height:8px;background:var(--acc)}
.chip.new{border-style:dashed;color:var(--mute)}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
.pw{position:relative}
.pw svg{position:absolute;right:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.recv{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.recv .n{display:flex;align-items:baseline;gap:4px;font-weight:700;color:var(--mute)}
.recv .n b{font:italic 800 36px/1 var(--num);color:var(--ink)}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.who span{background:var(--card);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:700}
/* tally */
.scs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.scs .s{display:grid;gap:6px;align-content:start}
.scs .h{display:flex;align-items:center;gap:4px}
.scs .h input{background:none;font-weight:700;padding:6px 4px}
.scs .h button{border:0;background:none;color:var(--mute);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:18px;flex:none}
.scs .h svg{width:18px;height:18px;color:var(--acc-ink);flex:none;margin:0 4px}
.scs .add{border:1.5px dashed var(--line);border-radius:12px;background:none;min-height:120px;color:var(--mute);font-weight:700;cursor:pointer;font-size:28px}
.warn{font-size:14px;font-weight:700;display:grid;gap:2px;margin-top:12px;border-left:4px solid var(--acc);padding-left:10px}.warn:empty{display:none}
.res{display:grid;gap:10px}
.cd{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:18px;border-radius:16px;background:var(--card)}
.cd .rk{grid-row:span 3;font:italic 800 56px/.9 var(--num);align-self:start}
.cd .rk small{font:900 16px "Zen Kaku Gothic New",sans-serif;margin-left:2px}
.cd.top{background:var(--acc);color:var(--on)}.cd.top h3 span,.cd.top .st div{color:#5a5000}.cd.top .st b{color:var(--on)}.cd.top .btn{background:var(--on);border-color:var(--on);color:var(--acc)}.cd.top .sv .m{background:var(--on);color:var(--acc)}
.cd h3{margin:0;font-size:18px;font-weight:900;line-height:1.3}
.cd h3 span{color:var(--mute);font-weight:500;font-size:15px}
.cd .cp{grid-column:3;grid-row:1}
.st{display:flex;flex-wrap:wrap;gap:4px 20px}
.st div{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--mute);font-weight:700}
.st b{font:700 22px var(--num);color:var(--ink)}
.sv{display:flex;flex-wrap:wrap;gap:4px 12px;font:600 20px var(--num);grid-column:2/-1}
.sv .f{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.sv .m{font-weight:700;background:var(--acc);color:var(--on);padding:0 5px}
/* judge */
.rl{display:grid;gap:10px}
.rc{background:var(--card);border-radius:16px;overflow:hidden}
.rc>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;width:100%;padding:18px;cursor:pointer}
.rc>button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.rc h3{margin:0;font-size:19px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .c{font:italic 800 26px var(--num)}.rc .c small{font:700 13px "Zen Kaku Gothic New";color:var(--mute);margin-left:2px}
.rc .lk{width:20px;height:20px;color:var(--mute)}
.rc form{display:flex;gap:8px;padding:0 18px 18px}
.rc form input{background:var(--bg)}
.rc form input.ng{border-color:var(--ink);border-width:2px}
.empty{padding:48px 0;text-align:center;color:var(--mute);font-weight:700}
.jhead{display:flex;align-items:center;gap:12px}
.jhead h3{margin:0;font-size:22px;font-weight:900;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jname{margin-top:16px}
.jl{display:grid;margin-top:8px}
.jr{display:grid;grid-template-columns:52px minmax(0,1fr) 104px 52px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.jr .no{font:italic 800 28px/1 var(--num);text-align:right;color:var(--mute)}
.jr .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr input{font:700 26px var(--num);text-align:center;padding:4px 8px;height:52px}
.jr .fv{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:var(--mute);transition:all .15s}
.jr .fv svg{width:22px;height:22px}
.jr .fv[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}.jr .fv:disabled{cursor:default}
.jr.mx input{border-color:var(--acc);border-width:2px}
.jr .tg{grid-column:1;justify-self:end;font:800 12px var(--num);background:var(--acc);color:var(--on);padding:1px 4px;display:none}
.jr.mx .tg{display:block}.jr.mx .no{display:none}
.prog{font:italic 800 22px var(--num);color:var(--mute)}.prog b{color:var(--ink)}
.locked .jr input,.locked #jName{background:transparent;border-color:var(--line)}
.jtime{font:700 18px var(--num);color:var(--mute);margin-right:auto;font-variant-numeric:tabular-nums}
.rc .nm{display:grid;gap:2px;min-width:0}.when{font-size:13px;font-weight:700;color:var(--mute)}.when.wait{color:var(--on);background:var(--acc);justify-self:start;padding:0 6px}
.tw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.tw label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--mute)}.tw .f{display:flex}.tw input{background:var(--card);border:1.5px solid transparent;padding:9px 12px;width:100%;font:700 16px var(--num);color:var(--ink);outline:0;min-height:44px}.tw input:focus{border-color:var(--ink)}.tw button{border:0;background:var(--card);color:var(--mute);width:44px;cursor:pointer;font-size:18px;flex:none}
[hidden]{display:none!important}
@media(max-width:720px){
 .it{grid-template-columns:44px 40px minmax(0,1fr)}
 .it .au,.it .src{grid-column:3/-1}
 .it .no{font-size:26px}
 .cd{grid-template-columns:64px minmax(0,1fr) auto;padding:14px}
 .cd .rk{font-size:40px;grid-row:span 2}
 .st,.sv{grid-column:1/-1}
 .jr{grid-template-columns:36px minmax(0,1fr) 88px 48px;gap:8px}
 .jr .fv{width:48px;height:48px}
 .g2{grid-template-columns:minmax(0,1fr)}
 .drop.mini{grid-template-columns:auto 1fr}.drop.mini .r{grid-column:1/-1}.drop.mini .r>*{flex:1}.drop.mini .r>#clear{flex:0 0 44px}
 .bar .wrap{gap:6px}.bar .btn{padding:0 12px}.hm{display:none}
 .sub{gap:20px}.sub button{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="seg" id="mode"><button data-m="host" aria-pressed="true">集計モード</button><button data-m="judge" aria-pressed="false">評価モード</button></div>
  <i class="conn" id="conn"></i>
</div></header>

<main class="wrap">
<div id="host">
  <div class="sub" id="hsub"><button data-v="pack" aria-pressed="true"><b>01</b>パック</button><button data-v="pub" aria-pressed="false"><b>02</b>公開</button><button data-v="tally" aria-pressed="false"><b>03</b>集計</button></div>

  <section id="pack">
    <div class="drop" id="drop">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg></div>
      <b id="dropT">TJA・音源・ZIP</b>
      <div class="r">
        <label class="btn ink">ファイル<input type="file" id="fFiles" multiple hidden></label>
        <button class="btn" id="clear" hidden aria-label="すべて消す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <div id="packBody" hidden>
      <h2>設定</h2>
      <div class="opts">
        <label class="nm">パック名<input type="text" id="root" value="譜面パック"></label>
        <label class="sw"><input type="checkbox" id="prefix" checked>番号</label>
        <label class="sw"><input type="checkbox" id="dropSub">SUBTITLE削除</label>
        <div class="mini-seg">音源名<div class="seg" id="am"><button data-a="match" aria-pressed="true">譜面と同名</button><button data-a="fixed" aria-pressed="false">統一</button></div><input type="text" id="audioName" value="song.ogg" hidden></div>
      </div>
      <h2>演奏順</h2>
      <div id="list"></div>
    </div>
  </section>

  <section id="pub" hidden>
    <div class="chips" id="myRooms"></div>
    <h2>大会</h2>
    <div class="g2">
      <input type="text" id="pName" placeholder="大会名" aria-label="大会名">
      <div class="pw"><input type="text" id="pPass" placeholder="あいことば" aria-label="あいことば" autocomplete="off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    </div>
    <h2>曲目</h2>
    <textarea id="songs" rows="10" placeholder="曲名【A】 / 作成者" aria-label="曲目"></textarea>
    <label class="btn" style="margin-top:8px">対応表を読込<input type="file" id="fJson" accept=".json,application/json" hidden></label>
    <h2>受付</h2>
    <div class="recv">
      <label class="sw"><input type="checkbox" id="pOpen" checked>公開中</label>
      <div class="n"><b id="subN">0</b>件</div>
    </div>
    <div class="tw">
      <label>開始<span class="f"><input type="datetime-local" id="pStart"><button type="button" data-clr="pStart" aria-label="開始をクリア">×</button></span></label>
      <label>締切<span class="f"><input type="datetime-local" id="pEnd"><button type="button" data-clr="pEnd" aria-label="締切をクリア">×</button></span></label>
    </div>
    <div class="who" id="who"></div>
  </section>

  <section id="tally" hidden>
    <div class="scs" id="scs"></div>
    <div class="warn" id="warns"></div>
    <div id="resWrap" hidden>
      <h2>結果</h2>
      <div class="res" id="out"></div>
    </div>
  </section>
</div>

<section id="judge" hidden>
  <div id="lobby">
    <h2>公開中</h2>
    <div class="rl" id="openRooms"></div>
  </div>
  <div id="jroom" hidden>
    <div class="jhead">
      <button class="btn" id="jBack" aria-label="戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h3 id="jTitle"></h3>
      <div class="prog" id="jProg"></div>
    </div>
    <input type="text" class="jname" id="jName" placeholder="評価者名" aria-label="評価者名" maxlength="40">
    <div class="jl" id="jl"></div>
  </div>
</section>
</main>

<div class="bar" id="barPack"><div class="wrap">
  <button class="btn sp" id="shuffle" aria-label="シャッフル"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span class="hm">シャッフル</span></button>
  <button class="btn" id="dlJson">対応表</button>
  <button class="btn" id="toPub">公開へ</button>
  <button class="btn pri" id="dlZip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>ZIP</button>
</div></div>
<div class="bar" id="barPub" hidden><div class="wrap">
  <button class="btn pri" id="pubBtn">公開</button>
</div></div>
<div class="bar" id="barTally" hidden><div class="wrap">
  <button class="btn sp" id="copyAll" disabled>すべてコピー</button>
  <button class="btn pri" id="run">集計</button>
</div></div>
<div class="bar" id="barJudge" hidden><div class="wrap">
  <span class="jtime" id="jTime"></span>
  <button class="btn pri" id="jSend">送信</button>
</div></div>

<script src="core.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
