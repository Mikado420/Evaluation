<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>譜面大会ツール</title>
<script>
// 新しい版が出ていたら、URL を変えて読み込み直す（ホーム画面のアプリでも古い画面が残らないように）
(function () {
  var V='1.7.3';
  function check() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.v || j.v === V) return;
      var u = new URL(location.href);
      if (u.searchParams.get('v') === j.v) return;
      u.searchParams.set('v', j.v); location.replace(u.toString());
    }).catch(function () {});
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#0a0a0a);--ink:light-dark(#0a0a0a,#fff);--mute:light-dark(#707070,#8c8c8c);--line:light-dark(#e2e2e2,#262626);--card:light-dark(#f3f3f3,#151515);--acc:#ffd60a;--on:#0a0a0a;--acc-ink:light-dark(#0a0a0a,#ffd60a);--num:"Barlow Condensed",sans-serif;--navh:calc(60px + env(safe-area-inset-bottom))}
*,*::before,*::after{border-radius:0!important;box-sizing:border-box;min-width:0}
html{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{max-width:100%;margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 max(4vw,16px)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* header / nav */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;height:52px}
header h1{margin:0;font-size:20px;font-weight:900}
.ver{margin-left:auto;font:600 13px var(--num);letter-spacing:.04em;color:var(--mute);white-space:nowrap}
.ver.off{background:var(--acc);color:var(--on);padding:1px 6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0a0a0a;border-top:1px solid #262626;padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
nav button{border:0;background:none;color:#8c8c8c;height:60px;display:grid;place-items:center;align-content:center;gap:3px;font-size:11px;font-weight:700;cursor:pointer;box-shadow:inset 0 3px 0 transparent}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:var(--navh);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;align-items:center;justify-content:flex-end}
.bar .sp{margin-right:auto}
main,section,header,nav,.bar{max-width:100vw}
main section{padding:14px 0 calc(var(--navh) + 90px)}
/* common */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.done{background:var(--ink);border-color:var(--ink);color:var(--acc)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg{width:18px;height:18px;flex:none}
input[type=text],textarea{background:var(--card);border:1.5px solid transparent;padding:9px 12px;width:100%;font-size:16px;outline:0;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--ink)}
input[readonly],textarea[readonly]{color:var(--mute)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:1.6;resize:vertical}
.ttl{font-size:13px;font-weight:700;color:var(--mute);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.ttl::after{content:"";flex:1;height:1px;background:var(--line);order:5}
.ttl .end{order:6}
.ttl button.t{border:0;background:none;padding:0;font:inherit;color:var(--mute);cursor:pointer;min-height:32px}
.ttl button.t[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:3px;text-underline-offset:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true],.tgl input:checked+.chip{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.dash{border-style:dashed;color:var(--mute)}
.chip svg{width:15px;height:15px;flex:none}
.chip .d{width:7px;height:7px;background:var(--acc)}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.tgl .on{display:none}.tgl input:checked+.chip .on{display:inline}.tgl input:checked+.chip .off{display:none}
.ci{display:inline-flex;align-items:center;border:1.5px solid var(--line);min-height:36px;padding:0 8px 0 0}
.ci input{background:none!important;border:0!important;padding:0 10px;font-weight:700;font-size:14px;width:9em}
.ci svg{width:14px;height:14px;color:var(--mute);flex:none}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{font-size:14px;font-weight:700;margin-top:10px;display:grid;gap:4px;border-left:4px solid var(--acc);padding-left:10px}.msg:empty{display:none}
/* pack */
.drop{display:grid;place-items:center;gap:14px;text-align:center;border:1.5px dashed var(--line);padding:56px 16px;transition:border-color .15s,background .15s}
.drop.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.drop .ic{width:56px;height:56px;background:var(--acc);display:grid;place-items:center;color:var(--on)}
.drop .ic svg{width:26px;height:26px}
.drop b{font-size:20px;font-weight:900;white-space:nowrap}
.drop .r{display:flex;gap:8px}
.drop.mini{display:flex;padding:8px 10px;border-style:solid;gap:10px;text-align:left}
.drop.mini .ic{width:30px;height:30px}.drop.mini .ic svg{width:16px;height:16px}
.drop.mini b{font-size:15px;margin-right:auto}
.drop.mini .r .btn{min-height:36px;padding:0 12px}
.cnt{font:italic 800 26px var(--num);margin:0 3px 0 2px}
.set{margin-top:10px}
.it{display:grid;grid-template-columns:28px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.it .no{font:italic 800 24px/1 var(--num);text-align:right}
.lab{display:grid;place-items:center;width:28px;height:28px;background:var(--acc);color:var(--on);font:800 17px var(--num)}
.lab.x{background:none;border:1.5px dashed var(--line)}
.it .t{min-width:0}.it .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t small{display:block;font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t small .bad{background:var(--acc);color:var(--on);font-weight:900;padding:0 4px}
.it .ed{display:grid;gap:6px}.it .ed input{padding:7px 10px}
.it .ed small{font-size:11px;color:var(--mute);word-break:break-all}
.it .er{display:flex;align-items:center;gap:8px}.it .er small{flex:1}
.del{border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font-weight:700;font-size:13px;min-height:32px;padding:0 10px;cursor:pointer;white-space:nowrap}.del:hover{background:var(--ink);color:var(--bg)}.del.arm{background:var(--acc);border-color:var(--acc);color:var(--on)}
.it.edit{cursor:default;background:linear-gradient(90deg,var(--acc) 3px,transparent 3px)}
.vw{border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font:700 13px var(--num);letter-spacing:.04em;padding:0 8px;cursor:pointer;min-height:30px}
.vw:hover{background:var(--acc);border-color:var(--acc);color:var(--on)}
#tree{display:grid}
.tr{display:flex;align-items:center;gap:12px;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%;min-height:44px}
.tr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.tr small{font:600 14px var(--num);color:var(--mute);white-space:nowrap}
.tr.rt{background:var(--acc);color:var(--on);padding:10px 12px;border:0}.tr.rt small{color:var(--on)}
.tr.fd span{font-weight:900}
.tr.fl{padding-left:24px}.tr.fl span{font-weight:500}
button.tr.fl{cursor:pointer}button.tr.fl:hover{background:var(--card)}button.tr.fl span::after{content:"  ›";color:var(--mute)}
.tr.au span::before{content:"♪ ";color:var(--mute)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-end}
.sh{background:var(--bg);width:min(100%,860px);max-height:88vh;height:88vh;display:flex;flex-direction:column;border-top:4px solid var(--acc);padding-bottom:env(safe-area-inset-bottom)}
.sh.auto{height:auto}
.sh-h{display:flex;align-items:center;gap:10px;padding:12px 16px}.sh-h b{flex:1;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-t{display:flex;align-items:center;gap:12px;padding:0 16px 10px;border-bottom:1px solid var(--line)}.sh-t span{font:600 13px var(--num);color:var(--mute)}
#shB{flex:1;overflow:auto;margin:0;padding:12px 16px;font:14px/1.6 ui-monospace,Menlo,monospace;white-space:pre;tab-size:4}
.ln{display:inline-block;width:3.2em;color:var(--mute);user-select:none;text-align:right;margin-right:12px}
.sh-b{padding:12px 16px 16px;display:grid;gap:10px}
/* pub */
.fld{display:grid;grid-template-columns:5.5em minmax(0,1fr);align-items:center;gap:8px;margin-bottom:8px}
.fld>span{font-size:13px;font-weight:700;color:var(--mute)}
.tw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tb{position:relative;overflow:hidden;border:1.5px solid var(--ink);min-height:60px;padding:6px 40px 6px 10px}
.tb.e{border-style:dashed;border-color:var(--line)}
.tb small{display:block;font-size:12px;font-weight:700;color:var(--mute)}
.tb b{font:700 21px/1.2 var(--num)}.tb.e b{color:var(--mute);font-family:inherit;font-size:15px}
.tb input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-width:0;max-width:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.tb button{position:absolute;right:0;top:0;bottom:0;width:38px;border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;z-index:1}
.stat{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 12px;margin-top:14px}
.stat .n{margin-left:auto;font:italic 800 30px/1 var(--num);color:var(--acc)}
.stat small{font-weight:700}
.sw{display:inline-flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-weight:700;white-space:nowrap}
.sw input{appearance:none;width:42px;height:24px;background:#555;position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{transform:translateX(18px);background:var(--on)}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.who span{background:var(--card);padding:3px 10px;font-size:14px;font-weight:700}
/* tally */
.warn{font-size:14px;font-weight:700;display:grid;gap:2px;margin-top:12px;border-left:4px solid var(--acc);padding-left:10px}.warn:empty{display:none}
.res{display:grid;gap:8px}
.cd{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 12px;padding:12px 14px;background:var(--card)}
.cd .rk{grid-column:1;grid-row:1/span 4;font:italic 800 38px/1 var(--num)}
.cd h3{grid-column:2;grid-row:1;margin:0;font-size:16px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd .au{grid-column:2;grid-row:2;font-size:13px;color:var(--mute)}
.cd .cp{grid-column:3;grid-row:1/span 2;width:38px;height:38px;min-height:0;padding:0;border-color:var(--ink)}
.cd .st{grid-column:2/-1;grid-row:3;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:6px}
.cd .st div{font-size:11px;font-weight:700;color:var(--mute)}
.cd .st b{display:block;font:700 20px var(--num);color:var(--ink)}
.cd .sv{grid-column:2/-1;grid-row:4;display:flex;flex-wrap:wrap;gap:4px 10px;font:600 18px var(--num);margin-top:4px}
.sv .f{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.sv .m{font-weight:700;background:var(--acc);color:var(--on);padding:0 5px}
.cd.top{background:var(--acc);color:var(--on)}.cd.top .au,.cd.top .st div{color:#5a5000}.cd.top .st b{color:var(--on)}
.cd.top .cp{background:var(--on);border-color:var(--on);color:var(--acc)}.cd.top .sv .m{background:var(--on);color:var(--acc)}
/* judge */
.rl{display:grid;gap:10px}
.rc{border:1.5px solid var(--ink)}
.rc>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;padding:14px;cursor:pointer}
.rc>button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.rc .nm{display:grid;gap:2px;min-width:0}
.rc h3{margin:0;font-size:17px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:13px;font-weight:700;color:var(--mute)}.when.wait{color:var(--on);background:var(--acc);justify-self:start;padding:0 6px}
.rc .c{font:italic 800 26px var(--num)}.rc .c small{font:700 13px "Zen Kaku Gothic New";color:var(--mute);margin-left:2px}
.rc .lk{width:20px;height:20px;color:var(--mute)}
.rc form{display:flex;gap:8px;padding:0 14px 14px}
.rc form input.ng{border-color:var(--ink);border-width:2px}
.empty{padding:48px 0;text-align:center;color:var(--mute);font-weight:700}
.jhead{display:flex;align-items:center;gap:10px}
.jhead h2{margin:0;font-size:20px;font-weight:900;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jhead .btn{min-height:38px;padding:0 10px}
.prog{font:italic 800 22px var(--num);color:var(--mute)}.prog b{color:var(--ink)}
.roster{font-size:13px;margin-top:6px;display:flex;gap:10px}.roster b{color:var(--mute);flex:none}
.jl{display:grid;margin-top:4px}
.jr{display:grid;grid-template-columns:40px minmax(0,1fr) 92px 50px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.jr .no{font:italic 800 26px/1 var(--num);text-align:right;color:var(--mute)}
.jr .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr input{font:700 26px var(--num);text-align:center;padding:4px 8px;height:50px}
.jr input::placeholder{font:700 12px "Zen Kaku Gothic New",sans-serif;color:var(--mute);opacity:.55}
.jr .fv{width:50px;height:50px;border:1.5px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:var(--mute);transition:all .15s}
.jr .fv svg{width:22px;height:22px}
.jr .fv[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on)}.jr .fv:disabled{cursor:default}
.jr.mx input{border-color:var(--acc);border-width:2px}
.jr .tg{grid-column:1;justify-self:end;font:800 12px var(--num);background:var(--acc);color:var(--on);padding:1px 4px;display:none}
.jr.mx .tg{display:block}.jr.mx .no{display:none}
.locked .jr input,.locked #jName{background:transparent;border-color:var(--line)}
.jtime{font:700 18px var(--num);color:var(--mute);margin-right:auto;font-variant-numeric:tabular-nums}
@media(max-width:520px){.jr{grid-template-columns:30px minmax(0,1fr) 80px 46px;gap:8px}.jr .fv{width:46px;height:46px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap"><h1 id="title">パック</h1><span class="ver" id="ver"></span></div></header>

<main class="wrap">
<section id="pack">
  <div class="drop" id="drop">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg></div>
    <b id="dropT">TJA・音源・ZIP</b>
    <div class="r">
      <label class="btn ink" id="addBtn">ファイル<input type="file" id="fFiles" multiple hidden></label>
      <button class="btn" id="clear" hidden aria-label="すべて消す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div id="packBody" hidden>
    <div class="chips set">
      <label class="ci"><input type="text" id="root" value="譜面パック" aria-label="パック名"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></label>
    </div>
    <div class="ttl"><button class="t" data-p="order" aria-pressed="true">演奏順</button>・<button class="t" data-p="files" aria-pressed="false">ファイル一覧</button></div>
    <div id="list"></div>
    <div id="tree" hidden></div>
  </div>
</section>

<section id="pub" hidden>
  <div class="chips" id="myRooms"></div>
  <div class="ttl">大会</div>
  <label class="fld"><span>大会名</span><input type="text" id="pName"></label>
  <label class="fld"><span>あいことば</span><input type="text" id="pPass" autocomplete="off" placeholder="なし"></label>
  <div class="ttl">受付</div>
  <div class="tw">
    <div class="tb" id="tbStart"><small>開始</small><b></b><input type="datetime-local" id="pStart" aria-label="開始"><button type="button" data-clr="pStart" aria-label="開始をクリア">×</button></div>
    <div class="tb" id="tbEnd"><small>締切</small><b></b><input type="datetime-local" id="pEnd" aria-label="締切"><button type="button" data-clr="pEnd" aria-label="締切をクリア">×</button></div>
  </div>
  <div class="ttl">曲目 <span id="songN"></span></div>
  <textarea id="songs" rows="6" placeholder="曲名【A】 / 作成者" aria-label="曲目"></textarea>
  <div class="stat"><label class="sw"><input type="checkbox" id="pOpen" checked>公開中</label><span class="n" id="subN">0</span><small>件</small></div>
  <div class="who" id="who"></div>
</section>

<section id="tally" hidden>
  <div class="chips" id="scs"></div>
  <div class="warn" id="warns"></div>
  <div id="resWrap" hidden>
    <div class="ttl">結果</div>
    <div class="res" id="out"></div>
  </div>
</section>

<section id="judge" hidden>
  <div id="lobby"><div class="rl" id="openRooms"></div></div>
  <div id="jroom" hidden>
    <div class="jhead">
      <button class="btn" id="jBack" aria-label="戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="jTitle"></h2>
      <div class="prog" id="jProg"></div>
    </div>
    <label class="fld" style="margin-top:12px"><span>評価者</span><input type="text" id="jName" maxlength="40"></label>
    <div class="roster" id="rosterWrap" hidden><b>参加者</b><span id="roster"></span></div>
    <div class="jl" id="jl"></div>
  </div>
</section>
</main>

<div class="sheet" id="sheet" hidden><div class="sh">
  <div class="sh-h"><b id="shT"></b><button class="btn" id="shX" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sh-t"><div class="chips" id="shSeg"><button class="chip" data-s="out" aria-pressed="true">出力</button><button class="chip" data-s="src" aria-pressed="false">元</button></div><span id="shE"></span></div>
  <pre id="shB"></pre>
</div></div>

<div class="sheet" id="scSheet" hidden><div class="sh auto">
  <div class="sh-h"><b id="scT"></b><button class="btn" id="scDel" aria-label="削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button><button class="btn" id="scX" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sh-b">
    <label class="fld"><span>採点者</span><input type="text" id="scName"></label>
    <textarea id="scText" rows="12" placeholder="71&#10;自譜面&#10;74○" aria-label="点数"></textarea>
  </div>
</div></div>

<div class="bar" id="barPack" hidden><div class="wrap">
  <button class="btn sp" id="shuffle" aria-label="シャッフル"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
  <button class="btn" id="toPub">公開へ</button>
  <button class="btn pri" id="dlZip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>ZIP</button>
</div></div>
<div class="bar" id="barPub" hidden><div class="wrap">
  <button class="btn pri" id="pubBtn">公開</button>
</div></div>
<div class="bar" id="barTally" hidden><div class="wrap">
  <button class="btn sp" id="copyAll" disabled>すべてコピー</button>
  <button class="btn pri" id="run">集計</button>
</div></div>
<div class="bar" id="barJudge" hidden><div class="wrap">
  <span class="jtime" id="jTime"></span>
  <button class="btn pri" id="jSend">送信</button>
</div></div>

<nav><div class="wrap">
  <button data-v="pack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7l8-4 8 4v10l-8 4-8-4z M4 7l8 4 8-4M12 11v10"/></svg>パック</button>
  <button data-v="pub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M5.6 18.4a9 9 0 0 1 0-12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>公開</button>
  <button data-v="tally"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5H6l6 7-6 7h12"/></svg>集計</button>
  <button data-v="judge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>評価</button>
</div></nav>

<script src="core.js?v=1.7.3"></script>
<script type="module" src="app.js?v=1.7.3"></script>
</body>
</html>
